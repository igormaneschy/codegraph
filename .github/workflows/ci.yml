name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: only reading the repository is needed.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: build · vet · test · race · coverage
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1" # tree-sitter is cgo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-ed:"; echo "$unformatted"; exit 1
          fi

      - name: go mod verify
        run: go mod verify

      - name: go mod tidy check
        run: go mod tidy -diff

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        run: go test ./...

      - name: test (race detector)
        run: go test -race ./...

      - name: coverage
        run: go test ./... -coverprofile=coverage.out -covermode=set

      - name: coverage summary
        run: go tool cover -func=coverage.out

      - name: upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error
          retention-days: 7

  typescript-integration:
    name: TypeScript resolver oracles
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "26.0.0"
          package-manager-cache: false

      # Match the package pinned by internal/scip/run.go; unit tests need no Node.
      - name: install pinned SCIP TypeScript
        run: npx --yes @sourcegraph/scip-typescript@0.4.0 --version

      - name: incremental versus rebuild (real resolver, race detector)
        run: go test -race -tags integration ./internal/index -run '^TestTSInvalidation_RealResolver' -count=1 -timeout 10m

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1" # tree-sitter is cgo; analyzers load packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Config is versioned in-repo (.golangci.yml); the golangci-lint version
      # is pinned here so runs are reproducible (no @latest / floating tags).
      # args are golangci-lint arguments: the action itself invokes the `run`
      # command, so passing `run ./...` would lint a second `run` path.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          args: ./...

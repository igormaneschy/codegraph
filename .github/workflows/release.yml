name: Release

on:
  push:
    tags: ["v*"]

# Least privilege by default; jobs override only what they need.
permissions:
  contents: read

jobs:
  validate:
    name: validate tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: assert SemVer tag
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Only vMAJOR.MINOR.PATCH[-prerelease] tags are releasable.
          # SemVer forbids leading zeros in numeric identifiers (e.g. v1.02.3).
          if ! [[ "$REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::ref '$REF_NAME' is not a SemVer release tag (expected vMAJOR.MINOR.PATCH[-prerelease], no leading zeros)"
            exit 1
          fi
          echo "tag '$REF_NAME' is a valid SemVer release tag"

  build:
    name: build ${{ matrix.asset }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: codegraph-linux-amd64
          - os: macos-latest
            asset: codegraph-darwin-arm64
          - os: windows-latest
            asset: codegraph-windows-amd64.exe
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      CGO_ENABLED: "1" # tree-sitter is cgo; each runner builds natively with its own C compiler
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        shell: bash
        run: go build -trimpath -ldflags "-s -w" -o "${{ matrix.asset }}" ./cmd/codegraph

      - name: upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  prepare:
    name: prepare release bundle
    needs: build # the bundle is only prepared after every matrix build passed
    runs-on: ubuntu-latest
    permissions:
      contents: read # never write repository contents here
      actions: read # download build artifacts, upload the prepared bundle
      id-token: write # mint OIDC token for Sigstore attestations
      attestations: write # persist attestations for the artifacts
      artifact-metadata: write # create the artifact storage record
    steps:
      - name: download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: generate checksums (flat directory)
        shell: bash
        run: |
          cd dist
          sha256sum codegraph-* > checksums.txt
          cat checksums.txt

      - name: verify checksums
        shell: bash
        run: |
          cd dist
          sha256sum -c checksums.txt

      # SBOM outputs go to sbom/, outside the dist/ input directory, so neither
      # SBOM scan ever picks up another SBOM's output; dist/ stays binaries
      # plus the checksums that bind them.
      - name: create SBOM output directory
        shell: bash
        run: mkdir -p sbom

      - name: SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: dist
          format: spdx-json
          syft-version: v1.50.0 # pinned Syft for reproducible SBOMs
          output-file: sbom/codegraph-${{ github.ref_name }}-spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: dist
          format: cyclonedx-json
          syft-version: v1.50.0 # pinned Syft for reproducible SBOMs
          output-file: sbom/codegraph-${{ github.ref_name }}-cyclonedx.json
          upload-artifact: false
          upload-release-assets: false

      - name: attest provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      - name: attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          sbom-path: sbom/codegraph-${{ github.ref_name }}-spdx.json
          # Bind the SBOM to the exact binaries that will be published.
          subject-checksums: dist/checksums.txt

      - name: stage immutable release bundle
        shell: bash
        run: |
          mkdir -p bundle
          cp dist/* bundle/
          cp sbom/* bundle/
          ls -la bundle/

      - name: upload release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codegraph-release-bundle
          path: bundle
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish release
    needs: prepare # only job allowed contents: write / GH_TOKEN; publishes the prepared bundle as-is
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release + upload all assets
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: download release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codegraph-release-bundle
          path: bundle

      - name: publish release
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Official gh CLI (no third-party release action); --verify-tag makes
          # sure the tag exists before publishing, bundle/* uploads every asset.
          # --repo pins the target repository explicitly: this job has no
          # checkout, so gh must not rely on a local git remote for resolution.
          gh release create "$REF_NAME" bundle/* --generate-notes --verify-tag --repo "$GITHUB_REPOSITORY"

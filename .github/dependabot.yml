# Dependabot keeps dependencies and pinned Actions versions up to date.
# Actions are pinned to full commit SHAs in the workflows; Dependabot updates
# both the SHA and the trailing `# vX.Y.Z` comment.
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(gomod)"
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(actions)"
    labels:
      - "dependencies"
